parameters:
  - name: environment
    type: string
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: storageAccount
    type: string
  - name: container
    type: string
  - name: terraformVersion
    type: string
    default: '1.5.7'

steps:
  - checkout: self

  - task: DownloadBuildArtifacts@1
    displayName: "Download ${{ parameters.environment }} Plan Artifact"
    inputs:
      buildType: 'current'
      downloadType: 'single'
      artifactName: 'tfplan-${{ parameters.environment }}'
      downloadPath: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'

  - task: TerraformInstaller@0
    displayName: "Install Terraform ${{ parameters.terraformVersion }}"
    inputs:
      terraformVersion: ${{ parameters.terraformVersion }}

  - task: TerraformTaskV4@4
    displayName: "Terraform Init (${{ parameters.environment }})"
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
      backendServiceArm: ${{ parameters.serviceConnection }}
      backendAzureRmResourceGroupName: ${{ parameters.resourceGroup }}
      backendAzureRmStorageAccountName: ${{ parameters.storageAccount }}
      backendAzureRmContainerName: ${{ parameters.container }}
      backendAzureRmKey: '${{ parameters.environment }}.terraform.tfstate'

  - task: TerraformTaskV4@4
    displayName: "Terraform Apply (${{ parameters.environment }})"
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
      environmentServiceNameAzureRM: ${{ parameters.serviceConnection }}
      commandOptions: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}/tfplan-${{ parameters.environment }}/${{ parameters.environment }}.tfplan'
